name: Release

# Pushing a version tag (v0.2.0) publishes that version to npm and creates the GitHub release from its changelog section.
# npm trusts this workflow directly (trusted publishing over OIDC), so no token is stored: the package's settings on
# npmjs.com must name repository smart-byte/pipelino and workflow file release.yml, with direct `npm publish` allowed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'smart-byte/pipelino' # npm trusts only this repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # prove to npm which workflow this is; npm also signs the provenance statement with it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # a release builds from scratch
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Check the tag against package.json and the changelog
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          grep -q "^## \[$version\] - [0-9]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      - run: npm publish # prepublishOnly runs the format check, the type-check, the tests and the build first
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" 'index($0, "## [") == 1 { on = index($0, heading) == 1; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
